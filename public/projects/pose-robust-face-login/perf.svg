<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Performance metrics" font-family="'JetBrains Mono', monospace">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient></defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="299" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#818cf8">RUNTIME PROFILE</text>
  <g text-anchor="middle">
    <g><rect x="40"  y="96" width="220" height="150" rx="12" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.4)"/>
      <text x="150" y="168" font-size="40" fill="#eef0ff" font-weight="700">&lt;100</text>
      <text x="150" y="196" font-size="12" fill="rgba(255,255,255,0.55)">ms / frame</text>
      <text x="150" y="218" font-size="10" fill="rgba(255,255,255,0.4)">recognition latency</text></g>
    <g><rect x="280" y="96" width="220" height="150" rx="12" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.4)"/>
      <text x="390" y="168" font-size="40" fill="#eef0ff" font-weight="700">&lt;30 s</text>
      <text x="390" y="196" font-size="12" fill="rgba(255,255,255,0.55)">full enrollment</text>
      <text x="390" y="218" font-size="10" fill="rgba(255,255,255,0.4)">guided multi-pose scan</text></g>
    <g><rect x="520" y="96" width="220" height="150" rx="12" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.4)"/>
      <text x="630" y="168" font-size="40" fill="#eef0ff" font-weight="700">512-d</text>
      <text x="630" y="196" font-size="12" fill="rgba(255,255,255,0.55)">L2-norm embedding</text>
      <text x="630" y="218" font-size="10" fill="rgba(255,255,255,0.4)">no image ever stored</text></g>
    <g><rect x="760" y="96" width="200" height="150" rx="12" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.4)"/>
      <text x="860" y="168" font-size="40" fill="#eef0ff" font-weight="700">0.44</text>
      <text x="860" y="196" font-size="12" fill="rgba(255,255,255,0.55)">cosine threshold</text>
      <text x="860" y="218" font-size="10" fill="rgba(255,255,255,0.4)">CPU or CUDA · ONNX</text></g>
  </g>
</svg>
