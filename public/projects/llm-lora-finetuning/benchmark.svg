<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Benchmark: v1 chat-template failure vs v2 fix">
  <rect width="900" height="560" fill="#0b0b12"/>
  <text x="34" y="46" font-family="'JetBrains Mono', monospace" font-size="18" fill="#a06bff" letter-spacing="1">The honest arc — benchmark</text>
  <text x="34" y="72" font-family="'Instrument Sans', sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">v1 broke on a mismatched chat template; v2 fixes the root cause and learns to call tools.</text>

  <!-- legend -->
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <rect x="620" y="34" width="14" height="14" rx="3" fill="#ff6b81"/>
    <text x="642" y="46" fill="rgba(255,255,255,0.65)">v1 · Llama</text>
    <rect x="740" y="34" width="14" height="14" rx="3" fill="#34d399"/>
    <text x="762" y="46" fill="rgba(255,255,255,0.65)">v2 · Gemma-4</text>
  </g>

  <!-- MMLU chart -->
  <g font-family="'JetBrains Mono', monospace">
    <text x="34" y="128" font-size="14" fill="#e6e6ee">MMLU (0-shot accuracy)</text>
    <line x1="120" y1="150" x2="120" y2="330" stroke="rgba(255,255,255,0.12)"/>
    <line x1="120" y1="270" x2="430" y2="270" stroke="rgba(233,196,106,0.45)" stroke-dasharray="5 5"/>
    <text x="436" y="274" font-size="11" fill="#e9c46a">random ≈ 25%</text>

    <!-- v1 bar (~random, broken) -->
    <rect x="170" y="258" width="70" height="72" rx="4" fill="#ff6b81" opacity="0.85"/>
    <text x="205" y="250" font-size="13" fill="#ff9caa" text-anchor="middle">26%</text>
    <text x="205" y="350" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">v1 (broken)</text>

    <!-- v2 bar (fixed) -->
    <rect x="300" y="162" width="70" height="168" rx="4" fill="#34d399"/>
    <text x="335" y="154" font-size="13" fill="#6ee7b7" text-anchor="middle" font-weight="700">61%</text>
    <text x="335" y="350" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">v2 (fixed)</text>
  </g>

  <!-- Tool-calling dial -->
  <g font-family="'JetBrains Mono', monospace" transform="translate(560 0)">
    <text x="0" y="128" font-size="14" fill="#e6e6ee">Correct-tool rate (held-out)</text>
    <circle cx="140" cy="248" r="86" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="18"/>
    <path d="M 140 162 A 86 86 0 1 1 98.3 172.8" fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round"/>
    <text x="140" y="242" font-size="40" fill="#6ee7b7" text-anchor="middle" font-weight="700">92%</text>
    <text x="140" y="270" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">v2 · up from 17%</text>
    <text x="140" y="360" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">incl. one unseen tool</text>
  </g>

  <line x1="34" y1="420" x2="866" y2="420" stroke="rgba(255,255,255,0.1)"/>
  <text x="34" y="452" font-family="'Instrument Sans', sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">Root cause: v1 applied a Gemma-3 chat template to Llama, silently zeroing most of the loss —</text>
  <text x="34" y="474" font-family="'Instrument Sans', sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">so instruction-following scored near chance. v2 derives the template from AutoProcessor with a round-trip test.</text>
  <text x="34" y="512" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">FIX → instruction-following restored · tool-calling 17% → 92% · identity now consistent</text>
  <text x="34" y="540" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a06bff">full write-ups in BENCHMARK_REPORT.md + _V2.md</text>
</svg>
