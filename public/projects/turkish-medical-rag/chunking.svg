<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Corpus and chunking" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker>
  </defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="419" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#10b981">CORPUS &amp; DETERMINISTIC CHUNKING</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">paragraph-then-token splitting · cl100k_base · reproducible with fixed seed 42</text>

  <!-- funnel -->
  <g font-size="11" text-anchor="middle">
    <g>
      <rect x="40" y="130" width="180" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="#2a2a3d"/>
      <text x="130" y="170" font-size="24" fill="#eef0f6" font-weight="700">24,612</text>
      <text x="130" y="192" font-size="10" fill="rgba(255,255,255,0.5)">raw hospital articles</text>
    </g>
    <path d="M220 170 H262" stroke="#10b981" stroke-width="1.6" marker-end="url(#fa)"/>
    <g>
      <rect x="262" y="130" width="180" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="#2a2a3d"/>
      <text x="352" y="170" font-size="24" fill="#eef0f6" font-weight="700">22,162</text>
      <text x="352" y="192" font-size="10" fill="rgba(255,255,255,0.5)">valid (−336 empty, −2,114 dup)</text>
    </g>
    <path d="M442 170 H484" stroke="#10b981" stroke-width="1.6" marker-end="url(#fa)"/>
    <g>
      <rect x="484" y="130" width="180" height="80" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.4)"/>
      <text x="574" y="170" font-size="24" fill="#eafff6" font-weight="700">300</text>
      <text x="574" y="192" font-size="10" fill="rgba(255,255,255,0.5)">sampled docs (seed 42)</text>
    </g>
    <path d="M664 170 H706" stroke="#10b981" stroke-width="1.6" marker-end="url(#fa)"/>
    <g>
      <rect x="706" y="130" width="254" height="80" rx="8" fill="rgba(16,185,129,0.09)" stroke="#10b981"/>
      <text x="833" y="170" font-size="24" fill="#eafff6" font-weight="700">2,072 chunks</text>
      <text x="833" y="192" font-size="10" fill="rgba(255,255,255,0.5)">mean 6.91 chunks / document</text>
    </g>
  </g>

  <!-- token histogram-ish -->
  <g transform="translate(40 250)">
    <text x="0" y="0" font-size="12" fill="#8ff0cf">TOKEN LENGTH / CHUNK</text>
    <g stroke="none">
      <rect x="0" y="24" width="60" height="70" rx="3" fill="rgba(16,185,129,0.25)"/>
      <rect x="80" y="14" width="60" height="80" rx="3" fill="rgba(16,185,129,0.45)"/>
      <rect x="160" y="34" width="60" height="60" rx="3" fill="rgba(16,185,129,0.3)"/>
      <rect x="240" y="54" width="60" height="40" rx="3" fill="rgba(16,185,129,0.18)"/>
    </g>
    <g font-size="9.5" fill="rgba(255,255,255,0.45)" text-anchor="middle">
      <text x="30" y="112">&lt;300</text><text x="110" y="112">300–450</text><text x="190" y="112">450–512</text><text x="270" y="112">512–531</text>
    </g>
    <g font-size="10.5" fill="rgba(255,255,255,0.62)">
      <text x="360" y="34">median 445 tokens</text>
      <text x="360" y="56">mean 412.6 · P95 509</text>
      <text x="360" y="78">max 531 · merge floor 30</text>
      <text x="360" y="100">64-token overlap on oversized units</text>
    </g>
    <g font-size="10.5">
      <rect x="640" y="16" width="280" height="94" rx="8" fill="rgba(16,185,129,0.05)" stroke="rgba(16,185,129,0.35)"/>
      <text x="660" y="42" fill="#8ff0cf" font-size="11">DATA INTEGRITY</text>
      <text x="660" y="66" fill="rgba(255,255,255,0.6)">0 empty chunks</text>
      <text x="660" y="86" fill="rgba(255,255,255,0.6)">0 docs without chunks</text>
      <text x="660" y="106" fill="rgba(255,255,255,0.6)">0 lost words · all 1024-d, no NaN/Inf</text>
    </g>
  </g>
</svg>
