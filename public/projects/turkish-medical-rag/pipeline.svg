<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Gated RAG pipeline" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef5350"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="459" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#10b981">THE GATED PIPELINE</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">The threshold is a hard stop before any language-model call — rejection is deterministic.</text>

  <g font-size="12">
    <!-- boxes row -->
    <g>
      <rect x="40" y="120" width="150" height="70" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.5)"/>
      <text x="115" y="150" font-size="12.5" fill="#eafff6" text-anchor="middle">User query</text>
      <text x="115" y="170" font-size="9.5" fill="rgba(255,255,255,0.42)" text-anchor="middle">Turkish</text>
    </g>
    <path d="M190 155 H230" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar)"/>
    <g>
      <rect x="230" y="120" width="160" height="70" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.5)"/>
      <text x="310" y="146" font-size="12" fill="#eafff6" text-anchor="middle">E5 embedding</text>
      <text x="310" y="164" font-size="9.5" fill="rgba(255,255,255,0.42)" text-anchor="middle">turkish-e5-large</text>
      <text x="310" y="178" font-size="9.5" fill="rgba(255,255,255,0.42)" text-anchor="middle">1024-d · L2-norm</text>
    </g>
    <path d="M390 155 H430" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar)"/>
    <g>
      <rect x="430" y="120" width="160" height="70" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.5)"/>
      <text x="510" y="146" font-size="12" fill="#eafff6" text-anchor="middle">ChromaDB</text>
      <text x="510" y="164" font-size="9.5" fill="rgba(255,255,255,0.42)" text-anchor="middle">cosine · HNSW</text>
      <text x="510" y="178" font-size="9.5" fill="rgba(255,255,255,0.42)" text-anchor="middle">top-5 retrieval</text>
    </g>
    <path d="M590 155 H630" stroke="#10b981" stroke-width="1.6" marker-end="url(#ar)"/>

    <!-- gate -->
    <g transform="translate(720 155)">
      <path d="M0 -56 L86 0 L0 56 L-86 0 Z" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="2.2"/>
      <text x="0" y="-8" font-size="12" fill="#eafff6" text-anchor="middle">threshold gate</text>
      <text x="0" y="14" font-size="16" fill="#10b981" text-anchor="middle" font-weight="700">sim ≥ 0.575</text>
      <text x="0" y="34" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">top-1 cosine</text>
    </g>

    <!-- accept path -->
    <path d="M806 130 C 860 100 890 100 920 100" stroke="#10b981" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="855" y="92" font-size="9.5" fill="#10b981">accept</text>
    <!-- reject path -->
    <path d="M806 180 C 860 214 890 214 920 214" stroke="#ef5350" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="852" y="232" font-size="9.5" fill="#ef5350">reject</text>
  </g>

  <!-- outcome cards -->
  <g font-size="11">
    <rect x="470" y="300" width="230" height="118" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.45)"/>
    <text x="490" y="328" font-size="12.5" fill="#eafff6">ACCEPT → grounded answer</text>
    <text x="490" y="352" font-size="10.5" fill="rgba(255,255,255,0.55)">Build context from top chunks,</text>
    <text x="490" y="369" font-size="10.5" fill="rgba(255,255,255,0.55)">cap 6,000 chars, sorted by score.</text>
    <text x="490" y="386" font-size="10.5" fill="rgba(255,255,255,0.55)">Claude answers in Turkish, context-only,</text>
    <text x="490" y="403" font-size="10.5" fill="rgba(255,255,255,0.55)">with title · URL · similarity source trace.</text>

    <rect x="730" y="300" width="230" height="118" rx="8" fill="rgba(239,83,80,0.05)" stroke="rgba(239,83,80,0.4)"/>
    <text x="750" y="328" font-size="12.5" fill="#ffb3b3">REJECT → fixed message</text>
    <text x="750" y="352" font-size="10.5" fill="rgba(255,255,255,0.55)">No LLM is ever called.</text>
    <text x="750" y="376" font-size="10" fill="rgba(255,255,255,0.68)" font-style="italic">“Bu sorunun cevabı dokümanlarımda</text>
    <text x="750" y="392" font-size="10" fill="rgba(255,255,255,0.68)" font-style="italic">yer almamaktadır.”</text>
  </g>

  <g font-size="10.5" fill="rgba(255,255,255,0.45)">
    <text x="40" y="326">Corpus preparation</text>
    <text x="40" y="352" fill="rgba(255,255,255,0.6)">24,612 → 22,162 valid docs</text>
    <text x="40" y="372" fill="rgba(255,255,255,0.6)">300 sampled (seed 42)</text>
    <text x="40" y="392" fill="rgba(255,255,255,0.6)">2,072 chunks · 6.91/doc</text>
    <text x="40" y="412" fill="rgba(255,255,255,0.6)">0 lost words</text>
  </g>
</svg>
