<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Threshold calibration" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient>
  </defs>
  <rect width="1000" height="480" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="479" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#10b981">THRESHOLD CALIBRATION</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">30-question benchmark · top-1 cosine similarity · positives vs. out-of-domain negatives</text>

  <!-- axis -->
  <g>
    <line x1="120" y1="380" x2="920" y2="380" stroke="#2a2a3d" stroke-width="1.5"/>
    <g font-size="10" fill="rgba(255,255,255,0.45)" text-anchor="middle">
      <line x1="120" y1="375" x2="120" y2="385" stroke="#2a2a3d"/><text x="120" y="402">0.40</text>
      <line x1="320" y1="375" x2="320" y2="385" stroke="#2a2a3d"/><text x="320" y="402">0.50</text>
      <line x1="520" y1="375" x2="520" y2="385" stroke="#2a2a3d"/><text x="520" y="402">0.60</text>
      <line x1="720" y1="375" x2="720" y2="385" stroke="#2a2a3d"/><text x="720" y="402">0.70</text>
      <line x1="920" y1="375" x2="920" y2="385" stroke="#2a2a3d"/><text x="920" y="402">0.80</text>
    </g>
    <text x="520" y="430" font-size="10.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">top-1 cosine similarity  →  scale: 0.40 – 0.84 mapped across axis (x = 120 + (sim-0.40)*2000)</text>
  </g>

  <!-- negatives band 0.459 - 0.567 -->
  <g>
    <rect x="238" y="150" width="216" height="70" rx="4" fill="rgba(239,83,80,0.10)" stroke="rgba(239,83,80,0.4)"/>
    <text x="346" y="140" font-size="11" fill="#ffb3b3" text-anchor="middle">10 negatives (out-of-domain)</text>
    <text x="346" y="190" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">min 0.459 · max 0.567</text>
    <line x1="238" y1="150" x2="238" y2="380" stroke="rgba(239,83,80,0.3)" stroke-dasharray="3 3"/>
    <line x1="454" y1="150" x2="454" y2="380" stroke="rgba(239,83,80,0.5)" stroke-dasharray="3 3"/>
  </g>

  <!-- positives band 0.583 - 0.838 -->
  <g>
    <rect x="486" y="240" width="510" height="70" rx="4" fill="rgba(16,185,129,0.10)" stroke="rgba(16,185,129,0.45)"/>
    <text x="700" y="230" font-size="11" fill="#8ff0cf" text-anchor="middle">20 positives (in-corpus)</text>
    <text x="700" y="280" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">min 0.583 · mean 0.709 · max 0.838</text>
    <line x1="486" y1="240" x2="486" y2="380" stroke="rgba(16,185,129,0.5)" stroke-dasharray="3 3"/>
  </g>

  <!-- threshold line -->
  <line x1="470" y1="100" x2="470" y2="380" stroke="#ffd166" stroke-width="2"/>
  <text x="470" y="94" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="700">threshold 0.575</text>

  <!-- gap callout -->
  <g>
    <path d="M454 340 H486" stroke="#ffd166" stroke-width="1.4"/>
    <text x="470" y="360" font-size="9.5" fill="#ffd166" text-anchor="middle">gap 0.0161</text>
  </g>

  <g font-size="10.5" fill="rgba(255,255,255,0.5)">
    <text x="40" y="462">Perfect-separation band ≈ [0.57, 0.58] — narrow. Calibrated on the eval set, not held-out: perfect metrics reflect calibration, not generalization.</text>
  </g>
</svg>
