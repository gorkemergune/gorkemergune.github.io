<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Evaluation metrics" font-family="'JetBrains Mono', monospace">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient></defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="419" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#10b981">EVALUATION · 30 FROZEN QUESTIONS</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">Retrieval correctness + threshold gate — measured on the calibration set.</text>

  <g>
    <!-- stat tiles -->
    <g>
      <rect x="40" y="110" width="220" height="120" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.4)"/>
      <text x="150" y="165" font-size="40" fill="#eafff6" text-anchor="middle" font-weight="700">20/20</text>
      <text x="150" y="192" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">expected parent @ rank-1</text>
      <text x="150" y="210" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">&amp; in top-5 (100%)</text>
    </g>
    <g>
      <rect x="280" y="110" width="220" height="120" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.4)"/>
      <text x="390" y="165" font-size="40" fill="#eafff6" text-anchor="middle" font-weight="700">1.000</text>
      <text x="390" y="192" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">precision · recall · F1</text>
      <text x="390" y="210" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">accuracy 1.000</text>
    </g>
    <g>
      <rect x="520" y="110" width="220" height="120" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.4)"/>
      <text x="630" y="165" font-size="40" fill="#eafff6" text-anchor="middle" font-weight="700">0.000</text>
      <text x="630" y="192" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">false accept rate</text>
      <text x="630" y="210" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">false reject 0.000</text>
    </g>
    <g>
      <rect x="760" y="110" width="200" height="120" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.4)"/>
      <text x="860" y="165" font-size="40" fill="#eafff6" text-anchor="middle" font-weight="700">107</text>
      <text x="860" y="192" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">tests passing</text>
      <text x="860" y="210" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">offline · no network</text>
    </g>
  </g>

  <!-- score distributions summary -->
  <g font-size="11">
    <rect x="40" y="270" width="920" height="98" rx="10" fill="rgba(255,255,255,0.02)" stroke="#20202f"/>
    <text x="60" y="298" font-size="12" fill="#8ff0cf">SCORE STATISTICS (top-1 cosine)</text>
    <text x="60" y="326" fill="rgba(255,255,255,0.6)">Positives</text>
    <text x="200" y="326" fill="rgba(16,185,129,0.9)">min 0.583</text>
    <text x="330" y="326" fill="rgba(16,185,129,0.9)">mean 0.709</text>
    <text x="470" y="326" fill="rgba(16,185,129,0.9)">max 0.838</text>
    <text x="60" y="352" fill="rgba(255,255,255,0.6)">Negatives</text>
    <text x="200" y="352" fill="rgba(239,83,80,0.9)">min 0.459</text>
    <text x="330" y="352" fill="rgba(239,83,80,0.9)">mean 0.527</text>
    <text x="470" y="352" fill="rgba(239,83,80,0.9)">max 0.567</text>
    <text x="640" y="340" font-size="10.5" fill="rgba(255,255,255,0.45)">Refuse-to-hallucinate by design:</text>
    <text x="640" y="356" font-size="10.5" fill="rgba(255,255,255,0.45)">coverage traded for zero false confidence.</text>
  </g>
</svg>
