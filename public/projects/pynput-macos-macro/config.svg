<text x="430" y="27" fill="#8a8aa0" text-anchor="middle" font-size="13">macro.py — configuration</text>
<text x="28" y="96" fill="#6a6a80" xml:space="preserve"># Edit these at the top of macro.py</text>
<text x="28" y="122" fill="#6a6a80" xml:space="preserve"></text>
<text x="28" y="148" fill="#00d4ff" xml:space="preserve">TOGGLE_KEY = keyboard.Key.f8</text>
<text x="28" y="174" fill="#00d4ff" xml:space="preserve">MACRO_KEYS = [&#x27;2&#x27;, &#x27;3&#x27;, &#x27;4&#x27;]</text>
<text x="28" y="200" fill="#00d4ff" xml:space="preserve">DELAY = 0.2</text>
<text x="28" y="226" fill="#6a6a80" xml:space="preserve"></text>
<text x="28" y="252" fill="#6a6a80" xml:space="preserve"># listener thread                      # macro thread</text>
<text x="28" y="278" fill="#e0e0e8" xml:space="preserve">with keyboard.Listener(                threading.Thread(</text>
<text x="28" y="304" fill="#e0e0e8" xml:space="preserve">    on_press=on_press) as l:               target=macro_loop,</text>
<text x="28" y="330" fill="#e0e0e8" xml:space="preserve">    l.join()                               daemon=True).start()</text>
