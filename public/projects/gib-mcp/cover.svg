<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="GİB Özelge MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/><stop offset="0.55" stop-color="#0a0a0f"/><stop offset="1" stop-color="rgba(234,179,8,0.14)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.32" r="0.62">
      <stop offset="0" stop-color="rgba(234,179,8,0.22)"/><stop offset="0.55" stop-color="rgba(234,179,8,0.05)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="rgba(234,179,8,0.05)" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="rgba(234,179,8,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/><path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>

  <g font-family="'JetBrains Mono', monospace">
    <text x="742" y="62" font-size="11" letter-spacing="3" text-anchor="end" fill="rgba(234,179,8,0.7)">MARK XXXI</text>
    <text x="60" y="114" font-size="13" letter-spacing="4" fill="rgba(234,179,8,0.85)">MODEL CONTEXT PROTOCOL SERVER</text>
    <text x="58" y="176" font-size="42" font-weight="700" fill="#f5f5f7" letter-spacing="1">GİB Özelge</text>
    <text x="62" y="212" font-size="12.5" fill="rgba(255,255,255,0.46)">Tax rulings for Claude — no tool answers until the source is verified</text>
  </g>

  <!-- tools -->
  <g transform="translate(58 254)" font-family="'JetBrains Mono', monospace">
    <rect x="0" y="0" width="404" height="188" rx="10" fill="rgba(255,255,255,0.02)" stroke="#3a3214"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" fill="rgba(234,179,8,0.75)">TOOL CONTRACTS</text>
    <g font-size="10.5">
      <rect x="16" y="42" width="372" height="30" rx="5" fill="rgba(234,179,8,0.08)" stroke="#5a4a14"/>
      <text x="30" y="61" fill="rgba(255,255,255,0.7)">gib_status()</text>
      <text x="374" y="61" text-anchor="end" fill="rgba(234,179,8,0.9)">scaffold</text>
      <rect x="16" y="82" width="372" height="30" rx="5" fill="rgba(255,255,255,0.02)" stroke="#3a3214"/>
      <text x="30" y="101" fill="rgba(255,255,255,0.55)">search_ozelge(query, page)</text>
      <text x="374" y="101" text-anchor="end" fill="rgba(255,255,255,0.4)">DISCOVERY_REQUIRED</text>
      <rect x="16" y="122" width="372" height="30" rx="5" fill="rgba(255,255,255,0.02)" stroke="#3a3214"/>
      <text x="30" y="141" fill="rgba(255,255,255,0.55)">get_ozelge(document_id)</text>
      <text x="374" y="141" text-anchor="end" fill="rgba(255,255,255,0.4)">DISCOVERY_REQUIRED</text>
    </g>
    <text x="16" y="174" font-size="9.5" letter-spacing="1.5" fill="rgba(255,255,255,0.34)">AN ERROR IS NEVER AN EMPTY RESULT</text>
  </g>

  <!-- discovery -->
  <g transform="translate(496 254)" font-family="'JetBrains Mono', monospace">
    <rect x="0" y="0" width="246" height="188" rx="10" fill="rgba(255,255,255,0.02)" stroke="#3a3214"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" fill="rgba(234,179,8,0.75)">DISCOVERY</text>
    <g font-size="10" fill="rgba(255,255,255,0.5)">
      <text x="16" y="56">Playwright · Chromium</text>
      <text x="16" y="80">→ HTML · form controls</text>
      <text x="16" y="104">→ fetch / XHR log</text>
      <text x="16" y="128">→ docs/DISCOVERY.md</text>
    </g>
    <text x="16" y="164" font-size="9.5" fill="rgba(234,179,8,0.75)">evidence first, adapter second</text>
  </g>
