<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="ayarlicazhocam Task Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/><stop offset="0.55" stop-color="#0a0a0f"/><stop offset="1" stop-color="rgba(232,121,249,0.15)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.6">
      <stop offset="0" stop-color="rgba(232,121,249,0.32)"/><stop offset="0.55" stop-color="rgba(232,121,249,0.07)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="rgba(232,121,249,0.05)" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="rgba(232,121,249,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/><path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>
  <g font-family="'JetBrains Mono', monospace">
    <text x="60" y="118" font-size="13" letter-spacing="4" fill="rgba(232,121,249,0.8)">TOOL-CALLING TASK AGENT · TR / EN</text>
    <text x="58" y="180" font-size="42" font-weight="700" fill="#f5f5f7" letter-spacing="1">ayarlıcazhocam</text>
    <text x="62" y="216" font-size="12.5" fill="rgba(255,255,255,0.46)">Conversational task manager · grounded in SQLite · invents nothing</text>
  </g>

  <!-- chat + tool trace -->
  <g transform="translate(58 258)" font-family="'JetBrains Mono', monospace" font-size="11">
    <rect x="0" y="0" width="360" height="182" rx="10" fill="rgba(255,255,255,0.03)" stroke="#2a2a3d"/>
    <rect x="16" y="18" width="230" height="30" rx="8" fill="rgba(232,121,249,0.10)" stroke="rgba(232,121,249,0.35)"/>
    <text x="30" y="38" fill="#f0c9ff">“yarın için görev ekle”</text>
    <g transform="translate(16 60)">
      <rect x="0" y="0" width="328" height="26" rx="6" fill="rgba(232,121,249,0.06)"/>
      <text x="10" y="17" fill="#e879f9">▸ create_task(title=…, due=…)</text>
      <rect x="0" y="32" width="328" height="26" rx="6" fill="rgba(255,255,255,0.02)"/>
      <text x="10" y="49" fill="rgba(255,255,255,0.6)">✓ success · id 42 · 0.9 s</text>
      <rect x="0" y="64" width="328" height="26" rx="6" fill="rgba(255,255,255,0.02)"/>
      <text x="10" y="81" fill="rgba(255,255,255,0.6)">▸ get_tasks(status=open) → 6 rows</text>
    </g>
    <text x="16" y="170" font-size="9.5" fill="rgba(255,255,255,0.4)">bounded tool loop · normalized envelopes · telemetry</text>
  </g>

  <!-- providers -->
  <g transform="translate(452 262)" font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="0" y="0" font-size="10.5" fill="rgba(232,121,249,0.75)" letter-spacing="2">PROVIDERS</text>
    <g>
      <rect x="0" y="14" width="290" height="34" rx="7" fill="rgba(232,121,249,0.05)" stroke="rgba(232,121,249,0.3)"/>
      <text x="14" y="35" fill="#eef0f6">Ollama · qwen2.5:7b</text><text x="270" y="35" fill="rgba(255,255,255,0.4)" text-anchor="end">local</text>
      <rect x="0" y="56" width="290" height="34" rx="7" fill="rgba(232,121,249,0.05)" stroke="rgba(232,121,249,0.3)"/>
      <text x="14" y="77" fill="#eef0f6">Groq · llama-3.3-70b</text><text x="270" y="77" fill="rgba(255,255,255,0.4)" text-anchor="end">~1 s</text>
      <rect x="0" y="98" width="290" height="34" rx="7" fill="rgba(232,121,249,0.05)" stroke="rgba(232,121,249,0.3)"/>
      <text x="14" y="119" fill="#eef0f6">Gemini 2.0 Flash</text><text x="270" y="119" fill="rgba(255,255,255,0.4)" text-anchor="end">cloud</text>
      <rect x="0" y="140" width="290" height="34" rx="7" fill="rgba(232,121,249,0.09)" stroke="#e879f9"/>
      <text x="14" y="161" fill="#f6dcff">+ fine-tuned Gemma</text><text x="270" y="161" fill="rgba(232,121,249,0.85)" text-anchor="end">mine</text>
    </g>
  </g>
</svg>
