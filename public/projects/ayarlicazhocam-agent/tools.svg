<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Tools and result envelope" font-family="'JetBrains Mono', monospace">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient></defs>
  <rect width="1000" height="420" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="419" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#e879f9">TOOLS &amp; STANDARDIZED ENVELOPE</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">Every tool returns the same shape — the loop normalizes results before the model sees them.</text>

  <g font-size="12">
    <g>
      <rect x="40" y="110" width="270" height="90" rx="10" fill="rgba(232,121,249,0.06)" stroke="rgba(232,121,249,0.45)"/>
      <text x="60" y="142" fill="#f6dcff">create_task</text>
      <text x="60" y="166" font-size="10" fill="rgba(255,255,255,0.5)">title · priority · due · project</text>
      <text x="60" y="186" font-size="10" fill="rgba(255,255,255,0.4)">→ new row, returns id</text>
    </g>
    <g>
      <rect x="40" y="212" width="270" height="90" rx="10" fill="rgba(232,121,249,0.06)" stroke="rgba(232,121,249,0.45)"/>
      <text x="60" y="244" fill="#f6dcff">get_tasks</text>
      <text x="60" y="268" font-size="10" fill="rgba(255,255,255,0.5)">filter by status / priority</text>
      <text x="60" y="288" font-size="10" fill="rgba(255,255,255,0.4)">→ rows from SQLite</text>
    </g>
    <g>
      <rect x="40" y="314" width="270" height="76" rx="10" fill="rgba(232,121,249,0.06)" stroke="rgba(232,121,249,0.45)"/>
      <text x="60" y="346" fill="#f6dcff">update_task</text>
      <text x="60" y="370" font-size="10" fill="rgba(255,255,255,0.5)">set status · complete · edit</text>
    </g>
  </g>

  <!-- envelope JSON -->
  <g transform="translate(360 110)">
    <rect x="0" y="0" width="600" height="280" rx="12" fill="#07070d" stroke="#2a2a3d"/>
    <text x="24" y="34" font-size="11" fill="rgba(232,121,249,0.75)">// normalized tool result</text>
    <g font-size="13" fill="rgba(255,255,255,0.85)">
      <text x="24" y="72">{</text>
      <text x="52" y="100"><tspan fill="#e879f9">"success"</tspan>: <tspan fill="#8ff0cf">true</tspan>,</text>
      <text x="52" y="128"><tspan fill="#e879f9">"data"</tspan>: { "id": 42, "title": "…", "status": "open" },</text>
      <text x="52" y="156"><tspan fill="#e879f9">"message"</tspan>: <tspan fill="#f0e6a0">"Görev oluşturuldu"</tspan>,</text>
      <text x="52" y="184"><tspan fill="#e879f9">"error"</tspan>: <tspan fill="#8ff0cf">null</tspan></text>
      <text x="24" y="212">}</text>
    </g>
    <line x1="24" y1="230" x2="576" y2="230" stroke="#20202f"/>
    <text x="24" y="256" font-size="10.5" fill="rgba(255,255,255,0.5)">Graceful errors surface as success:false + error — never a crash, never a hallucinated result.</text>
  </g>
</svg>
