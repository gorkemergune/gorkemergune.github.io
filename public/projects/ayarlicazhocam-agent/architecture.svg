<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Agent architecture" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e879f9"/></marker>
  </defs>
  <rect width="1000" height="440" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="439" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#e879f9">LAYERED AGENT ARCHITECTURE</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">A bounded tool-calling loop with normalized results and execution telemetry.</text>

  <g font-size="12" text-anchor="middle">
    <g>
      <rect x="60" y="150" width="140" height="150" rx="10" fill="rgba(232,121,249,0.06)" stroke="rgba(232,121,249,0.5)"/>
      <text x="130" y="220" fill="#eef0f6">Gradio UI</text>
      <text x="130" y="240" font-size="9.5" fill="rgba(255,255,255,0.45)">chat + stats</text>
    </g>
    <path d="M200 225 H240" stroke="#e879f9" stroke-width="1.6" marker-end="url(#ar)"/>
    <g>
      <rect x="240" y="150" width="150" height="150" rx="10" fill="rgba(232,121,249,0.06)" stroke="rgba(232,121,249,0.5)"/>
      <text x="315" y="214" fill="#eef0f6">Agent</text>
      <text x="315" y="232" fill="#eef0f6">Orchestrator</text>
      <text x="315" y="252" font-size="9.5" fill="rgba(255,255,255,0.45)">bounded loop</text>
    </g>
    <path d="M390 225 H430" stroke="#e879f9" stroke-width="1.6" marker-end="url(#ar)"/>
    <g>
      <rect x="430" y="150" width="150" height="150" rx="10" fill="rgba(232,121,249,0.06)" stroke="rgba(232,121,249,0.5)"/>
      <text x="505" y="214" fill="#eef0f6">Tool Registry</text>
      <text x="505" y="234" fill="#eef0f6">→ Task Tools</text>
      <text x="505" y="254" font-size="9.5" fill="rgba(255,255,255,0.45)">3 tools</text>
    </g>
    <path d="M580 225 H620" stroke="#e879f9" stroke-width="1.6" marker-end="url(#ar)"/>
    <g>
      <rect x="620" y="150" width="150" height="150" rx="10" fill="rgba(232,121,249,0.06)" stroke="rgba(232,121,249,0.5)"/>
      <text x="695" y="214" fill="#eef0f6">TaskService</text>
      <text x="695" y="234" fill="#eef0f6">→ Repository</text>
      <text x="695" y="254" font-size="9.5" fill="rgba(255,255,255,0.45)">business logic</text>
    </g>
    <path d="M770 225 H810" stroke="#e879f9" stroke-width="1.6" marker-end="url(#ar)"/>
    <g>
      <rect x="810" y="150" width="150" height="150" rx="10" fill="rgba(232,121,249,0.1)" stroke="#e879f9"/>
      <text x="885" y="220" fill="#f6dcff">SQLite</text>
      <text x="885" y="240" font-size="9.5" fill="rgba(255,255,255,0.5)">5 tables</text>
    </g>
  </g>

  <g font-size="10.5" fill="rgba(255,255,255,0.5)">
    <text x="40" y="352" fill="#e879f9" font-size="11">TABLES</text>
    <text x="40" y="374">projects · tasks · daily_plans · daily_plan_items · work_logs</text>
    <text x="40" y="398" fill="rgba(255,255,255,0.6)">Idempotent demo seed: 3 projects · 5 tasks · no work logs / completed tasks seeded.</text>
    <text x="40" y="418" fill="rgba(255,255,255,0.45)">Grounds every claim in the database — invents nothing.</text>
  </g>
</svg>
