<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="YOLO11 Detector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/>
      <stop offset="0.55" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="rgba(255,59,48,0.14)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(255,59,48,0.4)"/>
      <stop offset="0.55" stop-color="rgba(255,59,48,0.08)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="rgba(255,59,48,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- HUD corner brackets -->
  <g stroke="rgba(255,59,48,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/>
    <path d="M740 28 H772 V60"/>
    <path d="M28 440 V472 H60"/>
    <path d="M772 440 V472 H740"/>
  </g>

  <!-- Emblem: arc-reactor rings -->
  <g transform="translate(620 250)">
    <circle r="150" fill="none" stroke="rgba(255,59,48,0.12)" stroke-width="1"/>
    <circle r="120" fill="none" stroke="rgba(255,59,48,0.18)" stroke-width="1" stroke-dasharray="4 8"/>
    <circle r="92" fill="none" stroke="rgba(255,59,48,0.4)" stroke-width="2"/>
    <circle r="92" fill="rgba(255,59,48,0.06)"/>
    <circle r="150" fill="none" stroke="#ff3b30" stroke-width="3" stroke-dasharray="60 380" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(620 250)">
        <circle cx="0" cy="0" r="26" fill="none" stroke="#ff3b30" stroke-width="6"/>
        <path d="M 0 -46 v 14 M 0 32 v 14 M -46 0 h 14 M 32 0 h 14" fill="none" stroke="#ff3b30" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M -52 -40 v -12 h 12 M 52 -40 v -12 h -12 M -52 40 v 12 h 12 M 52 40 v 12 h -12" fill="none" stroke="#ff3b30" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g>

  <!-- Text block -->
  <g>
    <rect x="60" y="70" width="12" height="12" fill="#ff3b30"/>
    <text x="84" y="81" font-family="'JetBrains Mono', monospace" font-size="15" fill="#ff3b30" letter-spacing="4">MARK XIII</text>
    <text x="60" y="128" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(255,59,48,0.85)" letter-spacing="6">THE HUNTER</text>
    <text x="58" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#eef0f6" letter-spacing="-1">YOLO11 Detector</text>
    <text x="61" y="250" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#8a8aa0" letter-spacing="1">Single-Class Object Detection</text>
  </g>

  <g>
      <rect x="60" y="378" width="71.19999999999999" height="28" rx="14" fill="rgba(255,59,48,0.09)" stroke="rgba(255,59,48,0.4)"/>
      <text x="95.6" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff3b30" text-anchor="middle" letter-spacing="1">YOLO11</text>
    </g><g>
      <rect x="143.2" y="378" width="95.8" height="28" rx="14" fill="rgba(255,59,48,0.09)" stroke="rgba(255,59,48,0.4)"/>
      <text x="191.1" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff3b30" text-anchor="middle" letter-spacing="1">mAP 90.3%</text>
    </g>

  <!-- Status -->
  <g>
    <circle cx="66" cy="452" r="4" fill="#ff3b30"/>
    <text x="80" y="457" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5a5a70" letter-spacing="3">SYSTEM ONLINE</text>
  </g>
  <text x="740" y="457" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3a3a50" text-anchor="end" letter-spacing="2">STARK INDUSTRIES</text>
</svg>