<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Dayframe app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232832"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2029"/>
      <stop offset="1" stop-color="#13161d"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="week" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- calendar sheet -->
    <rect x="176" y="214" width="672" height="620" rx="72" fill="url(#card)" stroke="#2c313c" stroke-width="4"/>
    <path d="M176 330V286a72 72 0 0 1 72-72h528a72 72 0 0 1 72 72v44z" fill="url(#head)"/>
    <rect x="300" y="168" width="36" height="104" rx="18" fill="#d9dee6"/>
    <rect x="688" y="168" width="36" height="104" rx="18" fill="#d9dee6"/>

    <!-- week highlight -->
    <rect x="212" y="520" width="600" height="92" rx="24" fill="url(#week)"/>

    <!-- grid: 7 columns x 4 rows -->
    <g fill="#3a4150">
      <rect x="230" y="384" width="56" height="56" rx="14"/><rect x="314" y="384" width="56" height="56" rx="14"/><rect x="398" y="384" width="56" height="56" rx="14"/><rect x="482" y="384" width="56" height="56" rx="14"/><rect x="566" y="384" width="56" height="56" rx="14"/><rect x="650" y="384" width="56" height="56" rx="14"/><rect x="734" y="384" width="56" height="56" rx="14"/>
      <rect x="230" y="456" width="56" height="56" rx="14"/><rect x="314" y="456" width="56" height="56" rx="14"/><rect x="398" y="456" width="56" height="56" rx="14"/><rect x="482" y="456" width="56" height="56" rx="14"/><rect x="566" y="456" width="56" height="56" rx="14"/><rect x="650" y="456" width="56" height="56" rx="14"/><rect x="734" y="456" width="56" height="56" rx="14"/>
      <rect x="230" y="672" width="56" height="56" rx="14"/><rect x="314" y="672" width="56" height="56" rx="14"/><rect x="398" y="672" width="56" height="56" rx="14"/><rect x="482" y="672" width="56" height="56" rx="14"/><rect x="566" y="672" width="56" height="56" rx="14" opacity="0.5"/><rect x="650" y="672" width="56" height="56" rx="14" opacity="0.5"/><rect x="734" y="672" width="56" height="56" rx="14" opacity="0.5"/>
    </g>
    <g fill="#5d6a7d">
      <rect x="230" y="538" width="56" height="56" rx="14"/><rect x="314" y="538" width="56" height="56" rx="14"/><rect x="398" y="538" width="56" height="56" rx="14"/><rect x="566" y="538" width="56" height="56" rx="14"/><rect x="650" y="538" width="56" height="56" rx="14"/><rect x="734" y="538" width="56" height="56" rx="14"/>
    </g>
    <!-- today -->
    <circle cx="510" cy="566" r="110" fill="url(#glow)"/>
    <rect x="474" y="530" width="72" height="72" rx="18" fill="#00F0FF"/>
    <rect x="474" y="530" width="72" height="36" rx="18" fill="#ffffff" opacity="0.25"/>

    <rect width="1024" height="1024" rx="228" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
</svg>
