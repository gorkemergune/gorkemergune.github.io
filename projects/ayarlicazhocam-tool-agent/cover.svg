<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="ayarlicazhocam Tool Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/>
      <stop offset="0.55" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="rgba(52,211,153,0.14)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.55">
      <stop offset="0" stop-color="rgba(52,211,153,0.32)"/>
      <stop offset="0.55" stop-color="rgba(52,211,153,0.07)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="rgba(52,211,153,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <g stroke="rgba(52,211,153,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/>
    <path d="M740 28 H772 V60"/>
    <path d="M28 440 V472 H60"/>
    <path d="M772 440 V472 H740"/>
  </g>

  <g font-family="'JetBrains Mono', monospace">
    <text x="60" y="112" font-size="13" letter-spacing="4" fill="rgba(52,211,153,0.7)">FUNCTION CALLING · LIVE DATA</text>
    <text x="58" y="168" font-size="40" font-weight="700" fill="#f5f5f7">Tool Agent</text>
    <text x="60" y="200" font-size="13" fill="rgba(255,255,255,0.45)">Gemma-4 calls real public APIs — then answers in persona</text>
  </g>

  <!-- flow diagram -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">
    <g transform="translate(150 300)">
      <rect x="-70" y="-26" width="140" height="52" rx="8" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.4)"/>
      <text x="0" y="-2" fill="#e6e6ee">Gemma-4</text>
      <text x="0" y="16" fill="rgba(255,255,255,0.4)" font-size="10">Gemini API</text>
    </g>
    <g transform="translate(400 300)">
      <rect x="-80" y="-26" width="160" height="52" rx="8" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="-2" fill="#6ee7b7" font-weight="700">get_weather()</text>
      <text x="0" y="16" fill="rgba(255,255,255,0.4)" font-size="10">validated args</text>
    </g>
    <g transform="translate(650 300)">
      <rect x="-72" y="-26" width="144" height="52" rx="8" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.4)"/>
      <text x="0" y="-2" fill="#e6e6ee">Open-Meteo</text>
      <text x="0" y="16" fill="rgba(255,255,255,0.4)" font-size="10">public API</text>
    </g>
    <g stroke="rgba(52,211,153,0.6)" stroke-width="2" fill="none">
      <path d="M222 300 H318"/><path d="M480 300 H576"/>
    </g>
    <g fill="rgba(52,211,153,0.8)">
      <path d="M318 300 l-10 -5 v10 z"/><path d="M576 300 l-10 -5 v10 z"/>
    </g>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.35)">
    <text x="60" y="420">transparent tool-call trace · multi-turn loop · no code-exec access</text>
  </g>
</svg>
