      <rect x="60" y="378" width="46.599999999999994" height="28" rx="14" fill="rgba(154,160,170,0.09)" stroke="rgba(154,160,170,0.4)"/>
      <text x="83.3" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9aa0aa" text-anchor="middle" letter-spacing="1">C99</text>
    </g><g>
      <rect x="118.6" y="378" width="71.19999999999999" height="28" rx="14" fill="rgba(154,160,170,0.09)" stroke="rgba(154,160,170,0.4)"/>
      <text x="154.2" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9aa0aa" text-anchor="middle" letter-spacing="1">raylib</text>
    </g>

