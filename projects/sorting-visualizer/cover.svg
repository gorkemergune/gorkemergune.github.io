    <circle r="96" fill="none" stroke="rgba(154,160,170,0.18)" stroke-width="1" stroke-dasharray="4 8"/>
    <circle r="72" fill="none" stroke="rgba(154,160,170,0.4)" stroke-width="2"/>
    <circle r="72" fill="rgba(154,160,170,0.06)"/>
    <circle r="118" fill="none" stroke="#9aa0aa" stroke-width="3" stroke-dasharray="48 300" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(650 250)"><rect x="-52" y="6" width="15" height="40" rx="2" fill="#9aa0aa" opacity="0.50"/><rect x="-30" y="-24" width="15" height="70" rx="2" fill="#9aa0aa" opacity="0.60"/><rect x="-8" y="16" width="15" height="30" rx="2" fill="#9aa0aa" opacity="0.70"/><rect x="14" y="-42" width="15" height="88" rx="2" fill="#9aa0aa" opacity="0.80"/><rect x="36" y="-8" width="15" height="54" rx="2" fill="#9aa0aa" opacity="0.90"/></g>

  <g>
    <rect x="60" y="70" width="12" height="12" fill="#9aa0aa"/>
    <text x="84" y="81" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9aa0aa" letter-spacing="4">MARK I</text>
    <text x="60" y="128" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(154,160,170,0.85)" letter-spacing="6">THE ALGORITHM</text>
    <text x="58" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#eef0f6" letter-spacing="-1">Sorting Visualizer</text>
    <text x="61" y="250" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#8a8aa0" letter-spacing="1">Six Algorithms, Animated in C</text>
