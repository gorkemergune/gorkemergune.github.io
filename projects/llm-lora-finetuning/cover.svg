<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="ayarlicazhocam-training — v1 vs v2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/>
      <stop offset="0.55" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="rgba(160,107,255,0.16)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="rgba(160,107,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <g stroke="rgba(160,107,255,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/>
    <path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>

  <g>
    <rect x="60" y="60" width="12" height="12" fill="#a06bff"/>
    <text x="84" y="71" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a06bff" letter-spacing="4">MARK XIX · TWO FINE-TUNES</text>
    <text x="58" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#eef0f6" letter-spacing="-1">ayarlicazhocam-training</text>
    <text x="61" y="160" font-family="'Inter', system-ui, sans-serif" font-size="17" fill="#8a8aa0">A broken v1 on Llama, fixed into a thinking, tool-calling v2 on Gemma-4</text>
  </g>

  <!-- v1 card -->
  <g transform="translate(60 200)">
    <rect x="0" y="0" width="300" height="230" rx="12" fill="rgba(255,77,109,0.05)" stroke="rgba(255,77,109,0.35)"/>
    <text x="20" y="34" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff6b81" letter-spacing="2">v1 · RETIRED</text>
    <text x="20" y="66" font-family="Georgia, serif" font-size="24" fill="#e6e6ee">Llama 3.2-3B</text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.45)">LoRA / SFT · Colab</text>
    <g font-family="'JetBrains Mono', monospace">
      <text x="20" y="132" font-size="13" fill="rgba(255,255,255,0.55)">Tool-calling</text>
      <text x="280" y="132" font-size="18" fill="#ff6b81" text-anchor="end" font-weight="700">17%</text>
      <text x="20" y="164" font-size="13" fill="rgba(255,255,255,0.55)">Identity</text>
      <text x="280" y="164" font-size="14" fill="#ff6b81" text-anchor="end">hallucinated</text>
      <text x="20" y="196" font-size="13" fill="rgba(255,255,255,0.55)">Root cause</text>
      <text x="280" y="196" font-size="13" fill="#ff6b81" text-anchor="end">chat-template bug</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(378 315)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#a06bff" stroke-width="3"/>
    <path d="M42 0 l-12 -6 v12 z" fill="#a06bff"/>
    <text x="21" y="-14" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(160,107,255,0.8)" text-anchor="middle">FIXED</text>
  </g>

  <!-- v2 card -->
  <g transform="translate(440 200)">
    <rect x="0" y="0" width="300" height="230" rx="12" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="2"/>
    <text x="20" y="34" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" letter-spacing="2">v2 · CURRENT</text>
    <text x="20" y="66" font-family="Georgia, serif" font-size="24" fill="#f5f5f7">Gemma-4-E4B</text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">QLoRA · local RTX 5070</text>
    <g font-family="'JetBrains Mono', monospace">
      <text x="20" y="132" font-size="13" fill="rgba(255,255,255,0.6)">Tool-calling</text>
      <text x="280" y="132" font-size="18" fill="#6ee7b7" text-anchor="end" font-weight="700">92%</text>
      <text x="20" y="164" font-size="13" fill="rgba(255,255,255,0.6)">Identity</text>
      <text x="280" y="164" font-size="14" fill="#6ee7b7" text-anchor="end">consistent</text>
      <text x="20" y="196" font-size="13" fill="rgba(255,255,255,0.6)">Thinking</text>
      <text x="280" y="196" font-size="14" fill="#6ee7b7" text-anchor="end">native on/off</text>
    </g>
  </g>

  <text x="740" y="468" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3a3a50" text-anchor="end" letter-spacing="2">STARK INDUSTRIES</text>
</svg>
