      <text x="14" y="35" fill="#eef0f6">internet_search</text><text x="278" y="35" fill="rgba(255,255,255,0.4)" text-anchor="end">keyless</text>
      <rect x="0" y="56" width="290" height="34" rx="7" fill="rgba(226,54,54,0.05)" stroke="rgba(226,54,54,0.3)"/>
      <text x="14" y="77" fill="#eef0f6">get_weather</text><text x="278" y="77" fill="rgba(255,255,255,0.4)" text-anchor="end">Open-Meteo</text>
