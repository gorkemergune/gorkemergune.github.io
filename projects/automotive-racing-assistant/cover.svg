      <text x="14" y="119" fill="#eef0f6">check_part_status</text><text x="278" y="119" fill="rgba(255,255,255,0.4)" text-anchor="end">mock</text>
      <rect x="0" y="140" width="290" height="34" rx="7" fill="rgba(226,54,54,0.09)" stroke="#e23636"/>
      <text x="14" y="161" fill="#ffdcdc">get_race_regulations</text><text x="278" y="161" fill="rgba(226,54,54,0.85)" text-anchor="end">mock</text>
