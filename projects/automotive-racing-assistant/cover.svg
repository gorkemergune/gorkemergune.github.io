      <rect x="0" y="32" width="328" height="26" rx="6" fill="rgba(226,54,54,0.06)"/>
      <text x="10" y="49" fill="#ff6b6b">&#9656; get_weather(loc=Spa)</text>
      <rect x="0" y="64" width="328" height="26" rx="6" fill="rgba(255,255,255,0.02)"/>
      <text x="10" y="81" fill="rgba(255,255,255,0.6)">&#10003; grounded answer · 2 tools · &#8804; 5 rounds</text>
    </g>
    <text x="16" y="170" font-size="9.5" fill="rgba(255,255,255,0.4)">bounded tool loop · unknown &#8594; refuses, never invents</text>
