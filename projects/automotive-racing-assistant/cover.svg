    <rect x="0" y="0" width="360" height="182" rx="10" fill="rgba(255,255,255,0.03)" stroke="#3a2a2a"/>
    <rect x="16" y="18" width="300" height="30" rx="8" fill="rgba(226,54,54,0.10)" stroke="rgba(226,54,54,0.35)"/>
    <text x="30" y="38" fill="#ffc9c9">"is part BR-12 ready + Spa weather?"</text>
    <g transform="translate(16 60)">
