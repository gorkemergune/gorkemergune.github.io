<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Automotive Racing Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/><stop offset="0.55" stop-color="#0a0a0f"/><stop offset="1" stop-color="rgba(226,54,54,0.15)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.6">
      <stop offset="0" stop-color="rgba(226,54,54,0.30)"/><stop offset="0.55" stop-color="rgba(226,54,54,0.07)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="rgba(226,54,54,0.05)" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="rgba(226,54,54,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/><path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>
  <g font-family="'JetBrains Mono', monospace">
