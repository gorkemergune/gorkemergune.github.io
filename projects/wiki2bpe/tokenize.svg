<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 462" font-family="SF Mono, Menlo, monospace" font-size="15">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#12121f"/><stop offset="1" stop-color="#0a0a12"/></linearGradient></defs>
<rect width="860" height="462" rx="12" fill="url(#bg)" stroke="#2a2a3e"/>
<rect width="860" height="44" rx="12" fill="#1a1a2a"/>
<rect y="32" width="860" height="12" fill="#1a1a2a"/>
<circle cx="24" cy="22" r="6.5" fill="#ff5f57"/><circle cx="46" cy="22" r="6.5" fill="#febc2e"/><circle cx="68" cy="22" r="6.5" fill="#28c840"/>
<text x="430" y="27" fill="#8a8aa0" text-anchor="middle" font-size="13">python — my-tokenizer — 92×16</text>

<text x="28" y="82" fill="#6a6a80" xml:space="preserve">&gt;&gt;&gt; tok = AutoTokenizer.from_pretrained("gorkemergune/my-tokenizer")</text>
<text x="28" y="108" fill="#e0e0e8" xml:space="preserve">&gt;&gt;&gt; tok.tokenize("byte-level encoding")</text>

<!-- token chips -->
<g font-size="13">
<g><rect x="28" y="124" width="52" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="54" y="142" fill="#2ec4b6" text-anchor="middle">by</text></g>
<g><rect x="88" y="124" width="46" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="111" y="142" fill="#2ec4b6" text-anchor="middle">te</text></g>
<g><rect x="142" y="124" width="34" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="159" y="142" fill="#2ec4b6" text-anchor="middle">-</text></g>
<g><rect x="184" y="124" width="52" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="210" y="142" fill="#2ec4b6" text-anchor="middle">le</text></g>
<g><rect x="244" y="124" width="52" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="270" y="142" fill="#2ec4b6" text-anchor="middle">vel</text></g>
<g><rect x="304" y="124" width="70" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="339" y="142" fill="#2ec4b6" text-anchor="middle">Ġenc</text></g>
<g><rect x="382" y="124" width="52" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="408" y="142" fill="#2ec4b6" text-anchor="middle">od</text></g>
<g><rect x="442" y="124" width="52" height="26" rx="5" fill="rgba(46,196,182,0.12)" stroke="rgba(46,196,182,0.5)"/><text x="468" y="142" fill="#2ec4b6" text-anchor="middle">ing</text></g>
</g>

<text x="28" y="186" fill="#e0e0e8" xml:space="preserve">&gt;&gt;&gt; ids = tok("byte-level encoding")["input_ids"]</text>
<text x="28" y="212" fill="#febc2e" xml:space="preserve">[321, 494, 16, 508, 771, 289, 402, 655]</text>

<text x="28" y="252" fill="#e0e0e8" xml:space="preserve">&gt;&gt;&gt; tok.decode(ids)</text>
<text x="28" y="278" fill="#e0e0e8" xml:space="preserve">'byte-level encoding'</text>

<rect x="28" y="304" width="804" height="1" fill="#2a2a3e"/>
<text x="28" y="336" fill="#28c840" xml:space="preserve">✓ round-trip is lossless</text>
<text x="28" y="362" fill="#6a6a80" xml:space="preserve">byte-level → every UTF-8 string encodes with 0 &lt;unk&gt; tokens,</text>
<text x="28" y="386" fill="#6a6a80" xml:space="preserve">even with a tiny 2,048-token vocabulary</text>
<text x="28" y="426" fill="#e0e0e8" xml:space="preserve">&gt;&gt;&gt; <tspan fill="#2ec4b6">▋</tspan></text>
</svg>
