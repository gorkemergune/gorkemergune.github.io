<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Enroll and login pipeline" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
  </defs>
  <rect width="1000" height="470" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="469" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#818cf8">ENROLL &amp; LOGIN — CLEAN ARCHITECTURE</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">Perception adapters + persistence sit beneath the service layer; the UI is decoupled from the pipeline.</text>

  <!-- ENROLL row -->
  <text x="40" y="118" font-size="12" fill="#c7cbff">① ENROLL</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="130" width="150" height="66" rx="8" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.5)"/>
    <text x="115" y="158" fill="#eef0ff">guided rotation</text>
    <text x="115" y="176" font-size="9.5" fill="rgba(255,255,255,0.45)">−90° → +90° yaw</text>
    <path d="M190 163 H226" stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="226" y="130" width="150" height="66" rx="8" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.5)"/>
    <text x="301" y="152" fill="#eef0ff">detect + align</text>
    <text x="301" y="170" font-size="9.5" fill="rgba(255,255,255,0.45)">RetinaFace · 5-pt</text>
    <text x="301" y="184" font-size="9.5" fill="rgba(255,255,255,0.45)">solvePnP yaw</text>
    <path d="M376 163 H412 " stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="412" y="130" width="150" height="66" rx="8" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.5)"/>
    <text x="487" y="152" fill="#eef0ff">quality filter</text>
    <text x="487" y="170" font-size="9.5" fill="rgba(255,255,255,0.45)">size · blur · conf</text>
    <path d="M562 163 H598" stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="598" y="130" width="150" height="66" rx="8" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.5)"/>
    <text x="673" y="152" fill="#eef0ff">ArcFace embed</text>
    <text x="673" y="170" font-size="9.5" fill="rgba(255,255,255,0.45)">512-d · L2-norm</text>
    <text x="673" y="184" font-size="9.5" fill="rgba(255,255,255,0.45)">buffalo_l</text>
    <path d="M748 163 H784" stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="784" y="130" width="176" height="66" rx="8" fill="rgba(129,140,248,0.1)" stroke="#818cf8"/>
    <text x="872" y="152" fill="#eef0ff">SQLite gallery</text>
    <text x="872" y="170" font-size="9.5" fill="rgba(255,255,255,0.5)">embeddings by yaw bin</text>
    <text x="872" y="184" font-size="9.5" fill="rgba(129,140,248,0.85)">no images stored</text>
  </g>

  <!-- LOGIN row -->
  <text x="40" y="268" font-size="12" fill="#c7cbff">② LOGIN</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="280" width="150" height="66" rx="8" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.5)"/>
    <text x="115" y="308" fill="#eef0ff">live webcam</text>
    <text x="115" y="326" font-size="9.5" fill="rgba(255,255,255,0.45)">single frame</text>
    <path d="M190 313 H226" stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="226" y="280" width="150" height="66" rx="8" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.5)"/>
    <text x="301" y="308" fill="#eef0ff">align + embed</text>
    <text x="301" y="326" font-size="9.5" fill="rgba(255,255,255,0.45)">512-d probe</text>
    <path d="M376 313 H412" stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="412" y="280" width="150" height="66" rx="8" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.5)"/>
    <text x="487" y="308" fill="#eef0ff">cosine match</text>
    <text x="487" y="326" font-size="9.5" fill="rgba(255,255,255,0.45)">vs. gallery</text>
    <path d="M562 313 H598" stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <g transform="translate(673 313)">
      <path d="M0 -40 L70 0 L0 40 L-70 0 Z" fill="rgba(129,140,248,0.1)" stroke="#818cf8" stroke-width="2"/>
      <text x="0" y="-4" font-size="11" fill="#eef0ff" text-anchor="middle">≥ 0.44 ?</text>
      <text x="0" y="14" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle">threshold</text>
    </g>
    <path d="M743 313 H784" stroke="#818cf8" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="784" y="280" width="176" height="66" rx="8" fill="rgba(129,140,248,0.1)" stroke="#818cf8"/>
    <text x="872" y="308" fill="#eef0ff">grant / deny</text>
    <text x="872" y="326" font-size="9.5" fill="rgba(255,255,255,0.5)">session logged</text>
  </g>

  <!-- layers footer -->
  <g font-size="10.5" fill="rgba(255,255,255,0.45)">
    <text x="40" y="410" fill="#818cf8" font-size="11">LAYERS</text>
    <text x="40" y="432">Perception (cv/) · Services (coverage, matching, workflows) · Persistence (SQLite, repository) · UI (overlay, coverage viz)</text>
    <text x="40" y="452" fill="rgba(255,255,255,0.55)">4 tables · float32 BLOB embeddings · foreign keys with cascade delete · WAL journaling</text>
  </g>
</svg>
