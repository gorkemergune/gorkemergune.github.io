<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Pose-bin coverage" font-family="'JetBrains Mono', monospace">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient></defs>
  <rect width="1000" height="440" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="439" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#818cf8">POSE-BIN COVERAGE TRACKING</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">Enrollment guides the head through yaw bins until every bin is occupied — full coverage in under 30 s.</text>

  <!-- 7 bins across yaw -->
  <g transform="translate(80 120)">
    <g font-size="10" text-anchor="middle">
      <!-- bin cells: value = occupancy -->
      <g>
        <rect x="0"   y="60" width="110" height="80" rx="6" fill="rgba(129,140,248,0.30)" stroke="#818cf8"/>
        <rect x="120" y="60" width="110" height="80" rx="6" fill="rgba(129,140,248,0.55)" stroke="#818cf8"/>
        <rect x="240" y="60" width="110" height="80" rx="6" fill="rgba(129,140,248,0.75)" stroke="#818cf8"/>
        <rect x="360" y="60" width="110" height="80" rx="6" fill="rgba(129,140,248,0.9)" stroke="#a5b0ff"/>
        <rect x="480" y="60" width="110" height="80" rx="6" fill="rgba(129,140,248,0.75)" stroke="#818cf8"/>
        <rect x="600" y="60" width="110" height="80" rx="6" fill="rgba(129,140,248,0.55)" stroke="#818cf8"/>
        <rect x="720" y="60" width="110" height="80" rx="6" fill="rgba(129,140,248,0.30)" stroke="#818cf8"/>
      </g>
      <g fill="#0a0a12" font-weight="700" font-size="13">
        <text x="55" y="106">✓</text><text x="175" y="106">✓</text><text x="295" y="106">✓</text><text x="415" y="106">✓</text><text x="535" y="106">✓</text><text x="655" y="106">✓</text><text x="775" y="106">✓</text>
      </g>
      <g fill="rgba(255,255,255,0.55)" font-size="10">
        <text x="55" y="164">−90°</text><text x="175" y="164">−60°</text><text x="295" y="164">−30°</text><text x="415" y="164">0°</text><text x="535" y="164">+30°</text><text x="655" y="164">+60°</text><text x="775" y="164">+90°</text>
      </g>
      <text x="415" y="44" font-size="11" fill="#c7cbff">profile ← left        frontal        right → profile</text>
    </g>
  </g>

  <!-- progress ring -->
  <g transform="translate(200 350)">
    <circle r="42" fill="none" stroke="#20202f" stroke-width="10"/>
    <circle r="42" fill="none" stroke="#818cf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="264 264" transform="rotate(-90)"/>
    <text x="0" y="6" font-size="18" fill="#eef0ff" text-anchor="middle" font-weight="700">100%</text>
  </g>
  <g font-size="11" fill="rgba(255,255,255,0.6)">
    <text x="290" y="330">Coverage service marks each bin occupied as a quality-passing</text>
    <text x="290" y="350">frame is captured. Progress ring drives the on-screen overlay.</text>
    <text x="290" y="378" fill="#818cf8">Registration completes in &lt; 30 s for full coverage.</text>
    <text x="290" y="398" fill="rgba(255,255,255,0.5)">Multiple embeddings per identity, indexed by yaw + quality score.</text>
  </g>
</svg>
