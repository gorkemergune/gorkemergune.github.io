<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="VLM-GroundBench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/><stop offset="0.55" stop-color="#0a0a0f"/><stop offset="1" stop-color="rgba(34,211,238,0.15)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.6">
      <stop offset="0" stop-color="rgba(34,211,238,0.28)"/><stop offset="0.55" stop-color="rgba(34,211,238,0.06)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="rgba(34,211,238,0.05)" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="rgba(34,211,238,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/><path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>
  <g font-family="'JetBrains Mono', monospace">
    <text x="60" y="118" font-size="13" letter-spacing="4" fill="rgba(34,211,238,0.85)">VISION-LANGUAGE GROUNDING BENCHMARK</text>
    <text x="58" y="180" font-size="42" font-weight="700" fill="#f5f5f7" letter-spacing="1">VLM-GroundBench</text>
    <text x="62" y="216" font-size="12.5" fill="rgba(255,255,255,0.46)">Frozen protocol · immutable ground truth · raw outputs kept for verification</text>
  </g>

  <!-- grounding illustration -->
  <g transform="translate(58 256)">
    <rect x="0" y="0" width="330" height="184" rx="10" fill="rgba(255,255,255,0.02)" stroke="#183038"/>
    <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="rgba(34,211,238,0.75)" letter-spacing="2">"the red cone on the left"</text>
    <!-- scene -->
    <rect x="16" y="40" width="298" height="128" rx="6" fill="rgba(34,211,238,0.03)" stroke="#1c3a42"/>
    <rect x="150" y="70" width="90" height="70" rx="4" fill="none" stroke="rgba(255,255,255,0.18)" stroke-dasharray="4 4"/>
    <text x="152" y="64" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="rgba(255,255,255,0.35)">pred (VLM)</text>
    <rect x="60" y="86" width="78" height="62" rx="4" fill="rgba(34,211,238,0.08)" stroke="#22d3ee"/>
    <text x="60" y="80" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#22d3ee">ground truth</text>
    <text x="16" y="182" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.4)">IoU · hallucination · robustness · latency</text>
  </g>

  <!-- research questions -->
  <g transform="translate(430 262)" font-family="'JetBrains Mono', monospace" font-size="10.5">
    <text x="0" y="0" font-size="10.5" fill="rgba(34,211,238,0.78)" letter-spacing="2">EVALUATION AXES</text>
    <g fill="#dfe8ea">
      <rect x="0" y="14" width="312" height="30" rx="7" fill="rgba(34,211,238,0.05)" stroke="rgba(34,211,238,0.28)"/>
      <text x="14" y="34">01 · localization accuracy across VLMs</text>
      <rect x="0" y="50" width="312" height="30" rx="7" fill="rgba(34,211,238,0.05)" stroke="rgba(34,211,238,0.28)"/>
      <text x="14" y="70">02 · grounding-specialized model gains</text>
      <rect x="0" y="86" width="312" height="30" rx="7" fill="rgba(34,211,238,0.05)" stroke="rgba(34,211,238,0.28)"/>
      <text x="14" y="106">03 · prompt complexity &#8594; accuracy</text>
      <rect x="0" y="122" width="312" height="30" rx="7" fill="rgba(34,211,238,0.05)" stroke="rgba(34,211,238,0.28)"/>
      <text x="14" y="142">04 · scaling effects</text>
      <rect x="0" y="158" width="312" height="30" rx="7" fill="rgba(34,211,238,0.09)" stroke="#22d3ee"/>
      <text x="14" y="178" fill="#c9f4fb">05 · accuracy &#8596; latency &#8596; cost</text>
    </g>
  </g>
</svg>
