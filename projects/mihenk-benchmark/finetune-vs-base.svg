<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Finetune vs base analysis">
  <rect width="900" height="560" fill="#0b0b12"/>
  <text x="34" y="46" font-family="'JetBrains Mono', monospace" font-size="17" fill="#a06bff" letter-spacing="1">My own fine-tune, measured weight-matched against its base</text>
  <text x="34" y="74" font-family="'Instrument Sans', sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">ayarlicazhocam v2 (Gemma-4-E4B QLoRA)  vs  google/gemma-4-E4B-it — both 4-bit</text>

  <!-- grouped bars: base vs finetune across 4 metrics -->
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <!-- axis -->
    <line x1="70" y1="120" x2="70" y2="400" stroke="rgba(255,255,255,0.15)"/>
    <line x1="70" y1="400" x2="850" y2="400" stroke="rgba(255,255,255,0.15)"/>

    <!-- helper: base bar gray, finetune bar purple -->
    <!-- Overall -->
    <g transform="translate(130 0)">
      <rect x="0" y="170" width="48" height="230" fill="rgba(255,255,255,0.22)"/>
      <rect x="56" y="180" width="48" height="220" fill="#a06bff"/>
      <text x="24" y="160" text-anchor="middle" fill="rgba(255,255,255,0.6)">76.6</text>
      <text x="80" y="170" text-anchor="middle" fill="#c9b3ff" font-weight="700">73.4</text>
      <text x="52" y="424" text-anchor="middle" fill="rgba(255,255,255,0.5)">Overall</text>
      <text x="52" y="444" text-anchor="middle" fill="#ff7a7a" font-size="11">−3.2</text>
    </g>
    <!-- MC -->
    <g transform="translate(310 0)">
      <rect x="0" y="150" width="48" height="250" fill="rgba(255,255,255,0.22)"/>
      <rect x="56" y="140" width="48" height="260" fill="#a06bff"/>
      <text x="24" y="140" text-anchor="middle" fill="rgba(255,255,255,0.6)">83.2</text>
      <text x="80" y="130" text-anchor="middle" fill="#c9b3ff" font-weight="700">86.5</text>
      <text x="52" y="424" text-anchor="middle" fill="rgba(255,255,255,0.5)">Multiple choice</text>
      <text x="52" y="444" text-anchor="middle" fill="#5cd68a" font-size="11">+3.3</text>
    </g>
    <!-- Short answer -->
    <g transform="translate(490 0)">
      <rect x="0" y="180" width="48" height="220" fill="rgba(255,255,255,0.22)"/>
      <rect x="56" y="220" width="48" height="180" fill="#a06bff"/>
      <text x="24" y="170" text-anchor="middle" fill="rgba(255,255,255,0.6)">70.0</text>
      <text x="80" y="210" text-anchor="middle" fill="#c9b3ff" font-weight="700">60.2</text>
      <text x="52" y="424" text-anchor="middle" fill="rgba(255,255,255,0.5)">Short answer</text>
      <text x="52" y="444" text-anchor="middle" fill="#ff7a7a" font-size="11">−9.8 (verbosity)</text>
    </g>
    <!-- Tool calling -->
    <g transform="translate(670 0)">
      <rect x="0" y="330" width="48" height="70" fill="rgba(255,255,255,0.22)"/>
      <rect x="56" y="140" width="48" height="260" fill="#34d399"/>
      <text x="24" y="320" text-anchor="middle" fill="rgba(255,255,255,0.6)">17%</text>
      <text x="80" y="130" text-anchor="middle" fill="#6ee7b7" font-weight="700">92%</text>
      <text x="52" y="424" text-anchor="middle" fill="rgba(255,255,255,0.5)">Correct tool</text>
      <text x="52" y="444" text-anchor="middle" fill="#5cd68a" font-size="11">+75 pts</text>
    </g>
  </g>

  <!-- legend -->
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <rect x="600" y="88" width="14" height="14" fill="rgba(255,255,255,0.22)"/>
    <text x="622" y="100" fill="rgba(255,255,255,0.6)">base</text>
    <rect x="690" y="88" width="14" height="14" fill="#a06bff"/>
    <text x="712" y="100" fill="#c9b3ff">v2 fine-tune</text>
  </g>

  <g transform="translate(34 480)">
    <rect x="0" y="0" width="832" height="56" rx="8" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.3)"/>
    <text x="20" y="34" font-family="'Instrument Sans', sans-serif" font-size="14.5" fill="#c9f5e0">The honest trade-off: a small −3.2 overall regression bought a huge tool-calling gain and a consistent, learned identity — with MC actually improving.</text>
  </g>
</svg>
