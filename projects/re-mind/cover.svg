<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Re-Minder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/>
      <stop offset="0.55" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="rgba(244,114,182,0.14)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(244,114,182,0.4)"/>
      <stop offset="0.55" stop-color="rgba(244,114,182,0.08)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="rgba(244,114,182,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- HUD corner brackets -->
  <g stroke="rgba(244,114,182,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/>
    <path d="M740 28 H772 V60"/>
    <path d="M28 440 V472 H60"/>
    <path d="M772 440 V472 H740"/>
  </g>

  <!-- Emblem: arc-reactor rings -->
  <g transform="translate(620 250)">
    <circle r="150" fill="none" stroke="rgba(244,114,182,0.12)" stroke-width="1"/>
    <circle r="120" fill="none" stroke="rgba(244,114,182,0.18)" stroke-width="1" stroke-dasharray="4 8"/>
    <circle r="92" fill="none" stroke="rgba(244,114,182,0.4)" stroke-width="2"/>
    <circle r="92" fill="rgba(244,114,182,0.06)"/>
    <circle r="150" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="60 380" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(620 250)">
        <circle cx="0" cy="0" r="42" fill="none" stroke="#f472b6" stroke-width="6"/>
        <path d="M 0 0 v -26 M 0 0 l 20 12" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g>

  <!-- Text block -->
  <g>
    <rect x="60" y="70" width="12" height="12" fill="#f472b6"/>
    <text x="84" y="81" font-family="'JetBrains Mono', monospace" font-size="15" fill="#f472b6" letter-spacing="4">MARK XII</text>
    <text x="60" y="128" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(244,114,182,0.85)" letter-spacing="6">TIME KEEPER</text>
    <text x="58" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#eef0f6" letter-spacing="-1">Re-Minder</text>
    <text x="61" y="250" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#8a8aa0" letter-spacing="1">Native macOS Focus App</text>
  </g>

  <g>
      <rect x="60" y="378" width="63" height="28" rx="14" fill="rgba(244,114,182,0.09)" stroke="rgba(244,114,182,0.4)"/>
      <text x="91.5" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6" text-anchor="middle" letter-spacing="1">Tauri</text>
    </g><g>
      <rect x="135" y="378" width="54.8" height="28" rx="14" fill="rgba(244,114,182,0.09)" stroke="rgba(244,114,182,0.4)"/>
      <text x="162.4" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6" text-anchor="middle" letter-spacing="1">Rust</text>
    </g><g>
      <rect x="201.8" y="378" width="63" height="28" rx="14" fill="rgba(244,114,182,0.09)" stroke="rgba(244,114,182,0.4)"/>
      <text x="233.3" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6" text-anchor="middle" letter-spacing="1">React</text>
    </g>

  <!-- Status -->
  <g>
    <circle cx="66" cy="452" r="4" fill="#f472b6"/>
    <text x="80" y="457" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5a5a70" letter-spacing="3">SYSTEM ONLINE</text>
  </g>
  <text x="740" y="457" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3a3a50" text-anchor="end" letter-spacing="2">STARK INDUSTRIES</text>
</svg>