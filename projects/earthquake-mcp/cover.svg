<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="AFAD Earthquake MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/><stop offset="0.55" stop-color="#0a0a0f"/><stop offset="1" stop-color="rgba(249,115,22,0.15)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.32" r="0.62">
      <stop offset="0" stop-color="rgba(249,115,22,0.24)"/><stop offset="0.55" stop-color="rgba(249,115,22,0.06)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="rgba(249,115,22,0.05)" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="rgba(249,115,22,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/><path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>

  <g font-family="'JetBrains Mono', monospace">
    <text x="742" y="62" font-size="11" letter-spacing="3" text-anchor="end" fill="rgba(249,115,22,0.7)">MARK XXX</text>
    <text x="60" y="114" font-size="13" letter-spacing="4" fill="rgba(249,115,22,0.85)">MODEL CONTEXT PROTOCOL SERVER</text>
    <text x="58" y="176" font-size="42" font-weight="700" fill="#f5f5f7" letter-spacing="1">AFAD Earthquake</text>
    <text x="62" y="212" font-size="12.5" fill="rgba(255,255,255,0.46)">Live AFAD data — and it says when the answer may be incomplete</text>
  </g>

  <!-- request path -->
  <g transform="translate(58 254)" font-family="'JetBrains Mono', monospace">
    <rect x="0" y="0" width="404" height="188" rx="10" fill="rgba(255,255,255,0.02)" stroke="#3a2516"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" fill="rgba(249,115,22,0.75)">ONE TOOL CALL</text>
    <g font-size="10.5" fill="rgba(255,255,255,0.62)">
      <rect x="16" y="42" width="80" height="30" rx="5" fill="rgba(249,115,22,0.08)" stroke="#5a3418"/>
      <text x="34" y="61">Claude</text>
      <rect x="110" y="42" width="86" height="30" rx="5" fill="rgba(249,115,22,0.08)" stroke="#5a3418"/>
      <text x="124" y="61">validate</text>
      <rect x="210" y="42" width="74" height="30" rx="5" fill="rgba(249,115,22,0.08)" stroke="#5a3418"/>
      <text x="232" y="61">AFAD</text>
      <rect x="298" y="42" width="90" height="30" rx="5" fill="rgba(249,115,22,0.08)" stroke="#5a3418"/>
      <text x="314" y="61">coverage</text>
    </g>
    <g stroke="rgba(249,115,22,0.45)" stroke-width="1.4" fill="none">
      <path d="M96 57 H110"/><path d="M196 57 H210"/><path d="M284 57 H298"/>
    </g>
    <text x="16" y="100" font-size="9.5" letter-spacing="1.5" fill="rgba(255,255,255,0.34)">SOURCE KEEPS ONLY THE LATEST 1,000 EVENTS</text>
    <g font-size="10" fill="rgba(255,255,255,0.5)">
      <rect x="16" y="116" width="372" height="56" rx="6" fill="rgba(249,115,22,0.03)" stroke="#4a2c16"/>
      <text x="30" y="137" fill="rgba(249,115,22,0.85)">covered</text>
      <text x="140" y="137">oldest event ≤ requested start</text>
      <text x="30" y="157" fill="rgba(249,115,22,0.85)">possibly_incomplete</text>
      <text x="196" y="157">cap hit, range older</text>
    </g>
  </g>

  <!-- seismograph -->
  <g transform="translate(496 254)" font-family="'JetBrains Mono', monospace">
    <rect x="0" y="0" width="246" height="188" rx="10" fill="rgba(255,255,255,0.02)" stroke="#3a2516"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" fill="rgba(249,115,22,0.75)">81 PROVINCES · UTC+3</text>
    <path d="M16 104 H60 L68 92 L74 118 L82 70 L90 140 L98 84 L106 112 L114 100 L122 104 H230" fill="none" stroke="rgba(249,115,22,0.85)" stroke-width="1.6"/>
    <g font-size="9.5" fill="rgba(255,255,255,0.42)">
      <text x="16" y="160">İstanbul · istanbul · ISTANBUL</text>
      <text x="16" y="176">→ one canonical province</text>
    </g>
  </g>
</svg>
