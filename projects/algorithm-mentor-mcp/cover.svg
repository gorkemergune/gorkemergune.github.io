<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Algorithm Mentor MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/><stop offset="0.55" stop-color="#0a0a0f"/><stop offset="1" stop-color="rgba(96,165,250,0.15)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.32" r="0.62">
      <stop offset="0" stop-color="rgba(96,165,250,0.26)"/><stop offset="0.55" stop-color="rgba(96,165,250,0.06)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="rgba(96,165,250,0.05)" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="rgba(96,165,250,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/><path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>

  <g font-family="'JetBrains Mono', monospace">
    <text x="60" y="114" font-size="13" letter-spacing="4" fill="rgba(96,165,250,0.85)">MODEL CONTEXT PROTOCOL SERVER</text>
    <text x="58" y="176" font-size="42" font-weight="700" fill="#f5f5f7" letter-spacing="1">Algorithm Mentor</text>
    <text x="62" y="212" font-size="12.5" fill="rgba(255,255,255,0.46)">The server scores, not the model — guidance instead of answers</text>
  </g>

  <!-- mentoring loop -->
  <g transform="translate(58 254)" font-family="'JetBrains Mono', monospace">
    <rect x="0" y="0" width="404" height="188" rx="10" fill="rgba(255,255,255,0.02)" stroke="#1b2b44"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" fill="rgba(96,165,250,0.75)">SESSION LOOP</text>
    <g font-size="10.5" fill="rgba(255,255,255,0.62)">
      <rect x="16" y="42" width="80" height="30" rx="5" fill="rgba(96,165,250,0.08)" stroke="#24406b"/>
      <text x="32" y="61">assess</text>
      <rect x="110" y="42" width="86" height="30" rx="5" fill="rgba(96,165,250,0.08)" stroke="#24406b"/>
      <text x="126" y="61">problem</text>
      <rect x="210" y="42" width="74" height="30" rx="5" fill="rgba(96,165,250,0.08)" stroke="#24406b"/>
      <text x="228" y="61">submit</text>
      <rect x="298" y="42" width="90" height="30" rx="5" fill="rgba(96,165,250,0.08)" stroke="#24406b"/>
      <text x="314" y="61">review</text>
    </g>
    <g stroke="rgba(96,165,250,0.45)" stroke-width="1.4" fill="none">
      <path d="M96 57 H110"/><path d="M196 57 H210"/><path d="M284 57 H298"/>
      <path d="M343 72 V92 H55 V72" stroke-dasharray="4 4"/>
    </g>
    <text x="150" y="108" font-size="9.5" letter-spacing="1.5" fill="rgba(255,255,255,0.34)">PROFILE UPDATED → NEXT TOPIC</text>

    <g font-size="10" fill="rgba(255,255,255,0.5)">
      <rect x="16" y="124" width="372" height="48" rx="6" fill="rgba(96,165,250,0.03)" stroke="#1c3556"/>
      <text x="30" y="144" fill="rgba(96,165,250,0.8)">score</text>
      <text x="78" y="144">1.0 no hint · 0.8 one hint · 0.6 two+ · 0.5 explained · 0.2 failed</text>
      <text x="30" y="162" fill="rgba(96,165,250,0.8)">store</text>
      <text x="78" y="162">SQLite profile · EMA per topic · full attempt history</text>
    </g>
  </g>

  <!-- topic graph -->
  <g transform="translate(496 254)" font-family="'JetBrains Mono', monospace">
    <rect x="0" y="0" width="246" height="188" rx="10" fill="rgba(255,255,255,0.02)" stroke="#1b2b44"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" fill="rgba(96,165,250,0.75)">PREREQUISITE GRAPH</text>
    <g stroke="rgba(96,165,250,0.35)" stroke-width="1.3" fill="none">
      <path d="M52 60 L52 96"/><path d="M52 60 L134 96"/><path d="M52 96 L98 136"/><path d="M134 96 L170 136"/><path d="M190 60 L170 136"/>
    </g>
    <g fill="rgba(96,165,250,0.9)">
      <circle cx="52" cy="60" r="6"/><circle cx="190" cy="60" r="6"/>
      <circle cx="52" cy="96" r="5" fill="rgba(96,165,250,0.6)"/><circle cx="134" cy="96" r="5" fill="rgba(96,165,250,0.6)"/>
      <circle cx="98" cy="136" r="4.5" fill="rgba(96,165,250,0.4)"/><circle cx="170" cy="136" r="4.5" fill="rgba(96,165,250,0.4)"/>
    </g>
    <g font-size="9" fill="rgba(255,255,255,0.42)">
      <text x="24" y="48">arrays</text><text x="164" y="48">trees</text>
      <text x="14" y="116">hashmap</text><text x="112" y="116">binary</text>
      <text x="72" y="156">graphs</text><text x="158" y="156">dp</text>
    </g>
  </g>
</svg>
