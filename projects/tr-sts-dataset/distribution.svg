<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Similarity distribution" font-family="'JetBrains Mono', monospace">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c15"/><stop offset="1" stop-color="#08080e"/></linearGradient></defs>
  <rect width="1000" height="440" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="439" fill="none" stroke="#151522"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#38bdf8">SIMILARITY DISTRIBUTION</text>
  <text x="40" y="74" font-size="11.5" fill="rgba(255,255,255,0.4)">Deliberately many near-zero pairs — coverage of the full [−0.04, 0.97] range, not only paraphrases.</text>

  <!-- histogram -->
  <g transform="translate(80 120)">
    <line x1="0" y1="240" x2="820" y2="240" stroke="#2a2a3d" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="0" y2="240" stroke="#2a2a3d" stroke-width="1.4"/>
    <g>
      <!-- bars: near-zero heavy, then declining, small bump at high end -->
      <rect x="20"  y="30"  width="52" height="210" rx="3" fill="rgba(56,189,248,0.85)"/>
      <rect x="82"  y="70"  width="52" height="170" rx="3" fill="rgba(56,189,248,0.7)"/>
      <rect x="144" y="120" width="52" height="120" rx="3" fill="rgba(56,189,248,0.55)"/>
      <rect x="206" y="160" width="52" height="80"  rx="3" fill="rgba(56,189,248,0.45)"/>
      <rect x="268" y="180" width="52" height="60"  rx="3" fill="rgba(56,189,248,0.4)"/>
      <rect x="330" y="196" width="52" height="44"  rx="3" fill="rgba(56,189,248,0.36)"/>
      <rect x="392" y="204" width="52" height="36"  rx="3" fill="rgba(56,189,248,0.34)"/>
      <rect x="454" y="200" width="52" height="40"  rx="3" fill="rgba(56,189,248,0.36)"/>
      <rect x="516" y="188" width="52" height="52"  rx="3" fill="rgba(56,189,248,0.42)"/>
      <rect x="578" y="168" width="52" height="72"  rx="3" fill="rgba(56,189,248,0.5)"/>
      <rect x="640" y="150" width="52" height="90"  rx="3" fill="rgba(56,189,248,0.62)"/>
      <rect x="702" y="132" width="52" height="108" rx="3" fill="rgba(56,189,248,0.78)"/>
    </g>
    <g font-size="10" fill="rgba(255,255,255,0.45)" text-anchor="middle">
      <text x="46" y="262">0.0</text><text x="264" y="262">0.35</text><text x="480" y="262">0.6</text><text x="728" y="262">0.9</text>
      <text x="410" y="288" fill="rgba(255,255,255,0.55)">cosine similarity score</text>
    </g>
  </g>

  <g font-size="11" fill="rgba(255,255,255,0.6)">
    <rect x="80" y="392" width="14" height="14" fill="rgba(56,189,248,0.85)"/>
    <text x="104" y="404">unrelated (different topics), mean 0.148 — a large, deliberate share of the set</text>
  </g>
</svg>
