<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Turkish STS Dataset">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/><stop offset="0.55" stop-color="#0a0a0f"/><stop offset="1" stop-color="rgba(56,189,248,0.15)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.6">
      <stop offset="0" stop-color="rgba(56,189,248,0.32)"/><stop offset="0.55" stop-color="rgba(56,189,248,0.07)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="rgba(56,189,248,0.05)" stroke-width="1"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="rgba(56,189,248,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/><path d="M740 28 H772 V60"/><path d="M28 440 V472 H60"/><path d="M772 440 V472 H740"/>
  </g>
  <g font-family="'JetBrains Mono', monospace">
    <text x="60" y="118" font-size="13" letter-spacing="5" fill="rgba(56,189,248,0.78)">SEMANTIC TEXTUAL SIMILARITY · TR</text>
    <text x="58" y="182" font-size="46" font-weight="700" fill="#f5f5f7" letter-spacing="1">Turkish STS</text>
    <text x="62" y="218" font-size="12.5" fill="rgba(255,255,255,0.46)">Full-spectrum similarity — calibrate thresholds, not just paraphrases</text>
  </g>

  <!-- number line with three clusters -->
  <g transform="translate(60 300)">
    <line x1="0" y1="60" x2="680" y2="60" stroke="#2a3340" stroke-width="1.5"/>
    <g font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">
      <text x="0" y="86">0.0</text><text x="340" y="86">0.5</text><text x="680" y="86">1.0</text>
    </g>
    <!-- unrelated cluster near 0.148 -->
    <g fill="rgba(56,189,248,0.6)"><circle cx="70" cy="60" r="4"/><circle cx="95" cy="52" r="4"/><circle cx="110" cy="66" r="4"/><circle cx="130" cy="56" r="4"/><circle cx="85" cy="66" r="4"/><circle cx="120" cy="48" r="4"/></g>
    <text x="100" y="30" font-size="10" fill="#7fd4fb" text-anchor="middle">unrelated · 0.148</text>
    <!-- related near 0.406 -->
    <g fill="rgba(56,189,248,0.75)"><circle cx="260" cy="60" r="4"/><circle cx="285" cy="52" r="4"/><circle cx="300" cy="66" r="4"/><circle cx="278" cy="66" r="4"/></g>
    <text x="285" y="30" font-size="10" fill="#7fd4fb" text-anchor="middle">related · 0.406</text>
    <!-- paraphrase near 0.844 -->
    <g fill="rgba(56,189,248,0.95)"><circle cx="560" cy="60" r="4.5"/><circle cx="585" cy="52" r="4.5"/><circle cx="600" cy="66" r="4.5"/><circle cx="575" cy="66" r="4.5"/><circle cx="612" cy="54" r="4.5"/></g>
    <text x="585" y="30" font-size="10" fill="#cdeeff" text-anchor="middle">paraphrase · 0.844</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" fill="rgba(255,255,255,0.36)" font-size="11">
    <text x="60" y="452">1,037 pairs</text>
    <text x="180" y="452">·  933 train / 104 test</text>
    <text x="380" y="452">·  9 news domains</text>
    <text x="560" y="452">·  3 tiers</text>
  </g>
</svg>
