<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="WorldCup BPE Tokenizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/>
      <stop offset="0.55" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="rgba(255,159,28,0.14)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(255,159,28,0.4)"/>
      <stop offset="0.55" stop-color="rgba(255,159,28,0.08)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="rgba(255,159,28,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <g stroke="rgba(255,159,28,0.5)" stroke-width="2" fill="none">
    <path d="M28 60 V28 H60"/>
    <path d="M740 28 H772 V60"/>
    <path d="M28 440 V472 H60"/>
    <path d="M772 440 V472 H740"/>
  </g>

  <g transform="translate(650 250)">
    <circle r="118" fill="none" stroke="rgba(255,159,28,0.12)" stroke-width="1"/>
    <circle r="96" fill="none" stroke="rgba(255,159,28,0.18)" stroke-width="1" stroke-dasharray="4 8"/>
    <circle r="72" fill="none" stroke="rgba(255,159,28,0.4)" stroke-width="2"/>
    <circle r="72" fill="rgba(255,159,28,0.06)"/>
    <circle r="118" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-dasharray="48 300" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g transform="translate(650 250)" fill="none" stroke="#ff9f1c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-46" y="-30" width="34" height="24" rx="5"/>
    <rect x="-4" y="-30" width="24" height="24" rx="5" opacity="0.75"/>
    <rect x="28" y="-30" width="18" height="24" rx="5" opacity="0.55"/>
    <rect x="-46" y="6" width="22" height="24" rx="5" opacity="0.75"/>
    <rect x="-16" y="6" width="40" height="24" rx="5"/>
    <rect x="32" y="6" width="14" height="24" rx="5" opacity="0.55"/>
  </g>

  <g>
    <rect x="60" y="70" width="12" height="12" fill="#ff9f1c"/>
    <text x="84" y="81" font-family="'JetBrains Mono', monospace" font-size="15" fill="#ff9f1c" letter-spacing="4">MARK XVII</text>
    <text x="60" y="128" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(255,159,28,0.85)" letter-spacing="6">WORDSMITH</text>
    <text x="58" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#eef0f6" letter-spacing="-1">WorldCup BPE Tokenizer</text>
    <text x="61" y="250" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#8a8aa0" letter-spacing="1">Custom BPE Tokenizer + 4 Tiny LLM Architectures</text>
  </g>

  <g>
      <rect x="60" y="378" width="72" height="28" rx="14" fill="rgba(255,159,28,0.09)" stroke="rgba(255,159,28,0.4)"/>
      <text x="96" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff9f1c" text-anchor="middle" letter-spacing="1">Python</text>
    </g><g>
      <rect x="144" y="378" width="110" height="28" rx="14" fill="rgba(255,159,28,0.09)" stroke="rgba(255,159,28,0.4)"/>
      <text x="199" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff9f1c" text-anchor="middle" letter-spacing="1">Tokenizers</text>
    </g><g>
      <rect x="266" y="378" width="92" height="28" rx="14" fill="rgba(255,159,28,0.09)" stroke="rgba(255,159,28,0.4)"/>
      <text x="312" y="397" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff9f1c" text-anchor="middle" letter-spacing="1">PyTorch</text>
    </g>

  <g>
    <circle cx="66" cy="452" r="4" fill="#ff9f1c"/>
    <text x="80" y="457" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5a5a70" letter-spacing="3">SYSTEM ONLINE</text>
  </g>
  <text x="740" y="457" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3a3a50" text-anchor="end" letter-spacing="2">STARK INDUSTRIES</text>
</svg>
